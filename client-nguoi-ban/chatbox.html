<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chatbox AI – Sàn Online</title><link rel="stylesheet" href="css/style.css"></head><body><div class="shell"><aside class="side" id="side"></aside><div class="main"><header class="top" id="top"></header><main class="content" id="content">
<div class="card chat"><div class="h"><span class="ai">AI</span><div><b>Chatbox AI – Trợ lý người bán</b><small>Đang trực tuyến</small></div></div>
<div class="msgs" id="msgs"></div>
<div class="chips"><span>Cách thêm sản phẩm mới</span><span>Cách xử lý đơn hàng</span><span>Xem thống kê doanh thu</span></div>
<form class="send" id="f"><input id="q" placeholder="Nhập câu hỏi về việc quản lý gian hàng..." maxlength="500" autocomplete="off"><button class="btn">Gửi</button></form></div>
</main></div></div><script src="js/app.js"></script><script>
const box = () => $('#msgs');
function add(who, text) {
  const d = document.createElement('div'); d.className = 'm' + (who === 'me' ? ' me' : '');
  d.innerHTML = (who === 'me' ? '' : '<span class="ai dk">AI</span>') + '<div class="b">' + esc(text) + '</div>';
  box().appendChild(d); box().scrollTop = box().scrollHeight; return d;
}
async function ask(q) {
  q = q.trim(); if (!q) return; add('me', q); $('#q').value = '';
  const w = add('ai', 'Đang soạn câu trả lời...');
  try { const r = await api('/chatbot', { method: 'POST', body: { cauHoi: q } }); w.querySelector('.b').textContent = r.cauTraLoi; }
  catch (x) { w.querySelector('.b').textContent = 'Không thể xử lý yêu cầu: ' + x.message; }
  box().scrollTop = box().scrollHeight;
}
if (Layout.init('chatbox', 'Chatbox AI')) (async () => {
  add('ai', 'Xin chào! Mình là trợ lý AI hỗ trợ người bán. Bạn cần giúp gì trong quá trình quản lý gian hàng?');
  try { (await api('/chatbot/lich-su')).forEach(m => { add('me', m.cauHoi); add('ai', m.cauTraLoi); }); } catch (x) {}
  $('#f').onsubmit = (e) => { e.preventDefault(); ask($('#q').value); };
  $$('.chips span').forEach(c => c.onclick = () => ask(c.textContent));
})();
</script>
</body></html>
